<style>

/* =========================================================
   INVITACIÓN
   ========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #f7f7f7;
  font-family: 'Cinzel', serif;
  color: #000000;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  background-color: #ffffff;
  min-height: 100vh;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
}

.img-container {
  width: 100%;
  line-height: 0;
}

.img-container img {
  width: 100%;
  height: auto;
  display: block;
}

.map-container,
.gift-container {
  position: relative;
  width: 100%;
  line-height: 0;
}

.map-container img,
.gift-container img {
  width: 100%;
  height: auto;
  display: block;
}


/* Música */

.music-section {
  background-color: #000000;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.player-pill {
  background: #000000;
  padding: 8px 24px;
  border-radius: 50px;
  display: flex;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.play-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Contador */

.counter-section {
  background-color: #ffffff;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tiempo {
  display: flex;
  justify-content: center;
  align-items: center;
}

.bloque {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.bloque span {
  font-size: 26px;
  line-height: 1;
}

.label {
  font-size: 9px;
  letter-spacing: 1.5px;
  margin-top: 8px;
  opacity: .8;
}


/* Botones */

.btn-beige {
  display: inline-block;
  padding: 12px 20px;
  background-color: #BCB294;
  color: #ffffff;
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: 1.5px solid #A99F81;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(188, 178, 148, 0.45);
  white-space: nowrap;
  min-width: 140px;
  text-align: center;
}

.btn-beige:hover {
  background-color: #A99F81;
  transform: scale(1.05);
}

.abs-btn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.btn-catedral {
  top: 44%;
}

.btn-quinta {
  top: 90%;
}

.btn-mesa {
  top: auto;
  bottom: 20px;
}


/* Galería */

.gallery-section {
  background-color: #ffffff;
  padding: 20px 0;
  width: 100%;
}

.slider-container {
  position: relative;
  width: 100%;
  height: 500px;
  overflow: hidden;
}

.slider-container img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.slider-container img.active {
  opacity: 1;
}


/* =========================================================
   FORMULARIO DEL SEGUNDO CÓDIGO
   ========================================================= */

.rsvp-section {
  width: 100%;
  background: #ffffff;
  padding: 25px 15px;
}

.rsvp-section .contenedor {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.rsvp-section .tarjeta {
  background: #ffffff;
  border: 1px solid #BCB294;
  border-radius: 25px;
  padding: 35px 28px;
  box-shadow: 0 15px 45px rgba(0,0,0,.1);
}


/* ==========================================
   TITULO
   ========================================== */

.rsvp-section .titulo {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 42px;
  color: #000000;
  margin: 0 0 8px;
}

.rsvp-section .subtitulo {
  text-align: center;
  font-size: 13px;
  color: #333333;
  margin-bottom: 30px;
}

.rsvp-section .separador {
  width: 70px;
  height: 1px;
  background: #BCB294;
  margin: 12px auto 28px;
}


/* ==========================================
   CAMPOS
   ========================================== */

.rsvp-section .grupo {
  margin-bottom: 24px;
}

.rsvp-section .etiqueta {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 22px;
  color: #000000;
  margin-bottom: 9px;
}

.rsvp-section input {
  width: 100%;
  padding: 14px 15px;
  border-radius: 12px;
  border: 1px solid #000000;
  background: #ffffff;
  outline: none;
  font-family: 'Cinzel', serif;

}

.rsvp-section .opciones {
  display: flex;
  gap: 12px;
}

.rsvp-section .opcion {
  flex: 1;
}

.rsvp-section .opcion input {
  display: none;
}

.rsvp-section .opcion label {
  display: block;
  text-align: center;
  padding: 13px 8px;
  border: 1px solid #000000;
  border-radius: 12px;
  cursor: pointer;
  font-size: 13px;
  background: #ffffff;

}

.rsvp-section .opcion input:checked + label {
  background: #BCB294;
  border-color: #BCB294;
  color: #ffffff;

}


/* ==========================================
   BOTON ENVIAR
   ========================================== */

  border-radius: 30px;
  padding: 16px;

  font-family: 'Cinzel', serif;
  font-size: 14px;

}

.rsvp-section .boton:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* ==========================================
   MENSAJE
   ========================================== */

.rsvp-section .mensaje {
  display: none;
  text-align: center;
  margin-top: 25px;
  padding: 18px;
  border-radius: 15px;
  background: #f9f9f9;
  border: 1px solid #dddddd;
  line-height: 1.6;
  font-size: 14px;
}

.rsvp-section .mensaje.visible {
  display: block;
}


/* ==========================================
   PASE
   ========================================== */

.rsvp-section .pase {
  display: none;
  margin-top: 25px;
}

.rsvp-section .pase.visible {
  display: block;
}


/* ESTE ES EL CONTENIDO QUE SE DESCARGA */

#contenidoPase {

  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}


/* DECORACION SUPERIOR */

#contenidoPase::before {
  content: "✦";
  display: block;
  font-size: 18px;
  color: #BCB294;
  margin-bottom: 8px;
}


/* TITULO DEL PASE */

.pase-titulo {

  font-weight: 600;

/* NOMBRE */

.pase-nombre {

/* LINEA DECORATIVA */

}


/* CODIGO */

.codigo {
  display: inline-block;
  font-size: 27px;

  letter-spacing: 7px;
  color: #000000;
  padding: 10px 18px;

/* TEXTO DEL CODIGO */

.codigo-texto {

  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;

}


/* ==========================================
   BOTON DESCARGAR
   ========================================== */

.boton-descargar {

  border: 1px solid #BCB294;
  border-radius: 30px;
  padding: 14px 20px;
  margin-top: 16px;
  background: #BCB294;
  color: #ffffff;

  font-size: 13px;
  font-weight: 600;
  cursor: pointer;

}

.boton-descargar:hover {

}

.boton-descargar:disabled {

/* ==========================================

@media (max-width: 480px) {

  }

  }

  .pase-nombre {
    font-size: 25px;
  }

  .codigo {
    font-size: 23px;
    letter-spacing: 5px;
  }

}

</style>

<script>

/* =========================================================
   MÚSICA
   ========================================================= */

const audio =
  document.getElementById('audio');

const playBtn =
  document.getElementById('playBtn');

const icon =
  document.getElementById('icon');


function togglePlay() {

  if (audio.paused) {

    audio.play();

    icon.innerHTML =
      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  } else {

    audio.pause();

    icon.innerHTML =
      '<path d="M8 5v14l11-7z"/>';

  }

}


/* =========================================================
   CONTADOR
   ========================================================= */

// FECHA ACTUALIZADA AL 1 DE AGOSTO DE 2026

const fechaEvento =
  new Date("2026-08-01T00:00:00");


function actualizarContador() {

  const dif =
    fechaEvento -
    new Date().getTime();


  if (dif > 0) {

    document.getElementById("dias").textContent =
      Math.floor(
        dif /
        (1000 * 60 * 60 * 24)
      );


    document.getElementById("horas").textContent =
      Math.floor(
        (dif /
        (1000 * 60 * 60)) % 24
      )
      .toString()
      .padStart(2, "0");


    document.getElementById("minutos").textContent =
      Math.floor(
        (dif /
        (1000 * 60)) % 60
      )
      .toString()
      .padStart(2, "0");


    document.getElementById("segundos").textContent =
      Math.floor(
        (dif / 1000) % 60
      )
      .toString()
      .padStart(2, "0");

  } else {

    document.getElementById("dias").textContent =
      "000";

    document.getElementById("horas").textContent =
      "00";

    document.getElementById("minutos").textContent =
      "00";

    document.getElementById("segundos").textContent =
      "00";

  }

}


setInterval(
  actualizarContador,
  1000
);

actualizarContador();


/* =========================================================
   GALERÍA
   ========================================================= */

const images =
  document.querySelectorAll(
    '.slider-container img'
  );

let current = 0;


setInterval(() => {

  images[current]
    .classList
    .remove('active');


  current =
    (current + 1) %
    images.length;


  images[current]
    .classList
    .add('active');

}, 3000);


/* =========================================================
   GOOGLE APPS SCRIPT DEL SEGUNDO CÓDIGO
   ========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwCE6XxIHGi_IHbE6EZSi6v1iFXo2FEvY1ZNcsCyaRoVD2Cb-0LKbmLeLN6HK9l_3Wn/exec';


/* =========================================================
   API
   ========================================================= */

function llamarAPI(parametros) {

  return new Promise((resolve, reject) => {

    const callback =
      'cb_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 9999
      );


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams({

        ...parametros,

        callback:
          callback

      });


    const tiempo =
      setTimeout(() => {

        limpiar();

        reject();

      }, 15000);


    window[callback] =
      function(data) {

        clearTimeout(
          tiempo
        );

        limpiar();

        resolve(
          data
        );

      };


    function limpiar() {

      delete window[
        callback
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

    }


    script.onerror =
      function() {

        clearTimeout(
          tiempo
        );

        limpiar();

        reject();

      };


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(
      script
    );

  });

}


/* =========================================================
   ENVIAR
   ========================================================= */

async function enviar() {


  const nombre =
    document
      .getElementById(
        'nombre'
      )
      .value
      .trim();


  const asistencia =
    document.querySelector(
      'input[name="asistencia"]:checked'
    )?.value || '';


  const mensaje =
    document.getElementById(
      'mensaje'
    );


  const pase =
    document.getElementById(
      'pase'
    );


  const boton =
    document.getElementById(
      'boton'
    );


  /* ==========================================
     VALIDAR NOMBRE
     ========================================== */

  if (!nombre) {

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Escribe tu nombre completo.';

    return;

  }


  /* ==========================================
     VALIDAR APELLIDOS
     ========================================== */

  if (
    nombre.split(/\s+/).length < 3
  ) {

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Escribe tu nombre y tus dos apellidos.';

    return;

  }


  /* ==========================================
     VALIDAR ASISTENCIA
     ========================================== */

  if (!asistencia) {

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Selecciona tu asistencia.';

    return;

  }


  boton.disabled =
    true;

  boton.textContent =
    'Enviando...';


  try {


    const respuesta =
      await llamarAPI({

        accion:
          'confirmar',

        invitado1:
          nombre,

        asistencia1:
          asistencia

      });


    /* ==========================================
       RESPUESTA INCORRECTA
       ========================================== */

    if (!respuesta.ok) {

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        respuesta.mensaje;

      return;

    }


    /* ==========================================
       MENSAJE DE CONFIRMACION
       ========================================== */

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      respuesta.mensaje;


    /* ==========================================
       MOSTRAR PASE
       ========================================== */

    if (
      respuesta.listaPases &&
      respuesta.listaPases.length
    ) {


      const p =
        respuesta.listaPases[0];


      pase.className =
        'pase visible';


      pase.innerHTML = `

        <div id="contenidoPase">

          <div class="pase-titulo">
            Pase de entrada
          </div>

          <div class="pase-linea"></div>

          <div class="pase-nombre">
            ${escapar(p.nombre)}
          </div>

          <div class="codigo">
            ${escapar(p.codigo)}
          </div>

          <div class="codigo-texto">
            Código de acceso
          </div>

        </div>


        <!-- BOTON FUERA DEL PASE -->

        <button
          type="button"
          class="boton-descargar"
          onclick="descargarPase()"
        >
          Descargar pase
        </button>

      `;

    }


  }


  catch(error) {

    console.error(
      error
    );


    mensaje.className =
      'mensaje visible';


    mensaje.textContent =
      'No se pudo conectar con el sistema.';

  }


  finally {

    boton.disabled =
      false;

    boton.textContent =
      'Enviar confirmación';

  }

}


/* =========================================================
   DESCARGAR PASE
   ========================================================= */

async function descargarPase() {


  const contenido =
    document.getElementById(
      'contenidoPase'
    );


  if (!contenido) {

    return;

  }


  const boton =
    document.querySelector(
      '.boton-descargar'
    );


  boton.disabled =
    true;


  boton.textContent =
    'Preparando pase...';


  try {


    /* ==========================================
       CARGAR HTML2CANVAS
       ========================================== */

    if (
      !window.html2canvas
    ) {


      await new Promise(
        (resolve, reject) => {


          const script =
            document.createElement(
              'script'
            );


          script.src =
            'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';


          script.onload =
            resolve;


          script.onerror =
            reject;


          document.head.appendChild(
            script
          );

        }
      );

    }


    /* ==========================================
       CREAR IMAGEN DEL PASE
       ========================================== */

    const canvas =
      await html2canvas(
        contenido,
        {

          scale:
            3,

          backgroundColor:
            '#ffffff',

          useCORS:
            true,

          logging:
            false,

          imageTimeout:
            15000

        }
      );


    /* ==========================================
       DESCARGAR
       ========================================== */

    canvas.toBlob(
      function(blob) {


        if (!blob) {

          throw new Error(
            'No se pudo generar la imagen.'
          );

        }


        const url =
          URL.createObjectURL(
            blob
          );


        const enlace =
          document.createElement(
            'a'
          );


        enlace.href =
          url;


        enlace.download =
          'Pase-' +
          obtenerNombreArchivo() +
          '.png';


        document.body.appendChild(
          enlace
        );


        enlace.click();


        document.body.removeChild(
          enlace
        );


        setTimeout(
          function() {

            URL.revokeObjectURL(
              url
            );

          },
          1000
        );


      },
      'image/png'
    );


  }


  catch(error) {


    console.error(
      error
    );


    alert(
      'No se pudo descargar el pase. Intenta nuevamente.'
    );


  }


  finally {


    boton.disabled =
      false;


    boton.textContent =
      'Descargar pase';

  }

}


/* =========================================================
   NOMBRE DEL ARCHIVO
   ========================================================= */

function obtenerNombreArchivo() {


  const nombre =
    document
      .getElementById(
        'nombre'
      )
      .value
      .trim();


  return nombre

    .replace(
      /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,
      ''
    )

    .replace(
      /\s+/g,
      '-'
    )

    .substring(
      0,
      50
    )

    || 'Invitado';

}


/* =========================================================
   ESCAPAR
   ========================================================= */

function escapar(texto) {

  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
